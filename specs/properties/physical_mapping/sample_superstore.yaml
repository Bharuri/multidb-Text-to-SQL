relationships:
- name: fk_returns_order_id
  status: approved
  meaning: Each order line may have a return. Returns has one row per returned order, so Order_ID is unique
    on the parent side. Only 296 of the 5,111 distinct orders have a return, so the link is optional.
  cardinality: many_to_one
  enforceable_now: false
  enabled: true
  join_policy: left
  normalization:
    child: []
    parent: []
  fan_out: Returns is unique per Order_ID, so Orders-to-Returns does not multiply rows. The reverse path
    (Returns to Orders) repeats each return once per order line (800 lines match). Return-side metrics
    must use `count(distinct Order_ID)` or pre-aggregate before joining.
  child:
    table: Orders
    column: Order_ID
  parent:
    table: Returns
    column: Order_ID
  issues:
  - none for the join direction. Foreign key is not declared because 9,394 order lines have no matching
    return, which is expected for an optional parent.
  checks:
  - column: Order_ID
    child_type: VARCHAR
    parent_type: VARCHAR
    orphan_rows: 9394
- name: fk_orders_region
  status: approved
  meaning: Each order line belongs to one regional manager region listed in People.
  cardinality: many_to_one
  enforceable_now: true
  enabled: true
  join_policy: inner
  normalization:
    child: []
    parent: []
  fan_out: none; Region is unique in People.
  child:
    table: Orders
    column: Region
  parent:
    table: People
    column: Region
  issues: []
  checks:
  - column: Region
    child_type: VARCHAR
    parent_type: VARCHAR
    orphan_rows: 0
