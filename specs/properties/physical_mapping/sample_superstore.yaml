relationships:
- name: fk_returns_order_id
  status: proposed
  meaning: Each return refers to an order ID. Orders has one row per line item, so Order_ID repeats.
  cardinality: many-to-one
  enforceable_now: false
  child:
    table: Returns
    column: Order_ID
  parent:
    table: Orders
    column: Order_ID
  issues:
  - parent column Order_ID is not unique
  checks:
  - column: Order_ID
    child_type: VARCHAR
    parent_type: VARCHAR
    orphan_rows: 0
- name: fk_orders_region
  status: proposed
  meaning: Each order line belongs to one regional manager region listed in People.
  cardinality: many-to-one
  enforceable_now: true
  child:
    table: Orders
    column: Region
  parent:
    table: People
    column: Region
  issues: []
  checks:
  - column: Region
    child_type: VARCHAR
    parent_type: VARCHAR
    orphan_rows: 0
