  enforceable_now: false
  enabled: true
  join_policy: inner
  normalization:
    child: []
    parent:
    - cast BIGINT
  fan_out: one title has many cast rows. Title-level metrics must use `count(distinct show_id)` or pre-aggregate
    the bridge.
  child:
    table: netflix_titles_cast
    column: show_id
