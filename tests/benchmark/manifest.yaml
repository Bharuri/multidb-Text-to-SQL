# Benchmark manifest for specs/retrival/evaluation_question.md.
#
# Prompt text is NOT copied here. The runner reads each prompt from the source
# file by its ID, so the two cannot drift apart.
#
# status = what the system should do today, given config.yaml and the validators:
#   answerable      Should produce an answer.
#   clarification   Should ask the user for a definition before answering.
#   needs_config    Needs a configured value (band boundaries, as-of date, rating group).
#   profile_first   Answerable only after the data grain/key is profiled and confirmed.
#   gap             Needs a capability that is gated off or not allowlisted. Report, do not fake.
#
# split: every question is "development" (user decision). Requirement §17 asks for a
# held-out subset; that conflicts with this decision and is reported separately.

version: 1
split: development

